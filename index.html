<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Improv Letter MVP</title>
    <style>
      :root {
        --bg: #000;
        --fg: #fff;
        --muted: rgba(255, 255, 255, 0.38);
        --control-bg: rgba(255, 255, 255, 0.08);
        --control-border: rgba(255, 255, 255, 0.22);
        --control-fg: rgba(255, 255, 255, 0.88);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        font-family: "Arial Black", "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .stage {
        position: fixed;
        inset: 0;
        background: #000;
      }

      .mode-badge {
        position: absolute;
        top: 14px;
        right: 16px;
        z-index: 5;
        font-size: clamp(10px, 1.5vw, 14px);
        letter-spacing: 0.12em;
        opacity: 0.72;
        font-weight: 700;
      }

      .previous-letter {
        position: absolute;
        left: clamp(12px, 3.2vw, 42px);
        top: 50%;
        transform: translateY(-50%);
        font-size: min(29vh, 23vw);
        line-height: 1;
        font-weight: 900;
        color: var(--muted);
        pointer-events: auto;
        cursor: pointer;
      }

      .current-letter {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: min(67vh, 70vw);
        line-height: 1;
        font-weight: 900;
        color: #fff;
        text-align: center;
        pointer-events: auto;
        cursor: pointer;
        transition: opacity 120ms linear;
      }

      .current-letter.is-hidden {
        opacity: 0;
      }

      .controls {
        position: fixed;
        left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border: 1px solid var(--control-border);
        border-radius: 999px;
        background: var(--control-bg);
        backdrop-filter: blur(3px);
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .controls.is-hidden {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 14px);
      }

      .controls-handle {
        position: fixed;
        left: 50%;
        bottom: max(10px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 6;
        min-width: 72px;
        height: 20px;
        border: 1px solid var(--control-border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.72);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        opacity: 0.9;
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .controls-handle.is-hidden {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 8px);
      }

      .controls-hint {
        position: fixed;
        left: 50%;
        bottom: max(34px, calc(env(safe-area-inset-bottom) + 24px));
        transform: translateX(-50%);
        z-index: 6;
        font-size: clamp(9px, 1.2vw, 11px);
        letter-spacing: 0.04em;
        opacity: 0.68;
        color: rgba(255, 255, 255, 0.78);
        transition: opacity 200ms ease;
        pointer-events: none;
      }

      .controls-hint.is-hidden {
        opacity: 0;
      }

      .btn {
        border: 1px solid var(--control-border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--control-fg);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.02em;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .mode-switch {
        display: flex;
        gap: 4px;
      }

      .type-switch {
        display: flex;
        gap: 4px;
      }

      .mode-btn.active {
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }

      .type-btn.active {
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }

      .current-letter.is-action {
        max-width: 80vw;
        white-space: normal;
        word-break: break-word;
        line-height: 1.2;
        font-size: min(12vh, 8vw);
        text-align: center;
      }

      .previous-letter.is-action {
        max-width: 24vw;
        white-space: normal;
        word-break: break-word;
        line-height: 1.2;
        font-size: min(7vh, 4.6vw);
      }

      @media (max-width: 1024px) {
        .current-letter {
          font-size: min(65vh, 74vw);
        }
      }

      @media (orientation: portrait) {
        .current-letter {
          font-size: min(56vh, 78vw);
        }

        .previous-letter {
          font-size: min(22vh, 20vw);
        }

        .current-letter.is-action {
          font-size: min(9.5vh, 8.6vw);
        }

        .previous-letter.is-action {
          max-width: 30vw;
          font-size: min(5.2vh, 4.3vw);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <div id="modeBadge" class="mode-badge">LETTER | EASY</div>
      <div id="prevLetter" class="previous-letter"></div>
      <div id="currentLetter" class="current-letter">А</div>

      <div id="controls" class="controls is-hidden" aria-label="Панель управления">
        <button id="nextBtn" class="btn" type="button">Следующая буква</button>
        <button id="toggleBtn" class="btn" type="button">Скрыть</button>
        <div class="type-switch" role="group" aria-label="Тип режима">
          <button class="btn type-btn active" type="button" data-type="LETTER">LETTER</button>
          <button class="btn type-btn" type="button" data-type="ACTION">ACTION</button>
        </div>
        <div id="modeSwitch" class="mode-switch" role="group" aria-label="Режим сложности">
          <button class="btn mode-btn active" type="button" data-mode="EASY">EASY</button>
          <button class="btn mode-btn" type="button" data-mode="MEDIUM">MEDIUM</button>
          <button class="btn mode-btn" type="button" data-mode="CHAOS">CHAOS</button>
        </div>
      </div>
      <button
        id="controlsHandle"
        class="controls-handle"
        type="button"
        aria-label="Показать или скрыть управление"
      >
        МЕНЮ
      </button>
      <div id="controlsHint" class="controls-hint">Тап по МЕНЮ или двойной тап по фону</div>
    </main>

    <script>
      "use strict";

      // ===== 1) Наборы данных =====
      const LETTER_SETS = {
        EASY: "б в г д ж з к л м н п р с т ф х ц ч ш".toUpperCase().split(" "),
        MEDIUM:
          "б в г д ж з к л м н п р с т ф х ц ч ш а о е и н т р с л к м п д"
            .toUpperCase()
            .split(" "),
        CHAOS:
          "а б в г д е ж з и к л м н о п р с т у ф х ц ч ш щ ы э ю я"
            .toUpperCase()
            .split(" "),
      };

      function createAction(base) {
        return { base };
      }

      const ACTION_SET = [
        createAction("говорить громко"),
        createAction("смотреть в глаза"),
        createAction("перебивать"),
        createAction("смеяться"),
        createAction("использовать руки"),
        createAction("двигаться"),
        createAction("задавать вопросы"),
        createAction("соглашаться"),
        createAction("спорить"),
        createAction("молчать"),
      ];

      // ===== 2) Универсальная логика колоды =====
      function shuffleFisherYates(source) {
        const arr = source.slice();
        for (let i = arr.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function createDeck(getSource, getId) {
        return {
          mode: "EASY",
          cards: [],
          index: 0,

          reset(mode, avoidId = "") {
            this.mode = mode;
            this.cards = shuffleFisherYates(getSource(mode));
            this.index = 0;
            this.ensureFirstNot(avoidId);
          },

          ensureFirstNot(avoidId) {
            if (!avoidId || this.cards.length < 2 || getId(this.cards[0]) !== avoidId) return;
            const idx = this.cards.findIndex((item) => getId(item) !== avoidId);
            if (idx > 0) {
              [this.cards[0], this.cards[idx]] = [this.cards[idx], this.cards[0]];
            }
          },

          draw(currentId = "") {
            if (!this.cards.length) return null;

            for (let guard = 0; guard < 8; guard += 1) {
              if (this.index >= this.cards.length) {
                this.cards = shuffleFisherYates(getSource(this.mode));
                this.index = 0;
                this.ensureFirstNot(currentId);
              }

              const card = this.cards[this.index];
              if (getId(card) !== currentId) {
                this.index += 1;
                return card;
              }

              let swapIndex = -1;
              for (let i = this.index + 1; i < this.cards.length; i += 1) {
                if (getId(this.cards[i]) !== currentId) {
                  swapIndex = i;
                  break;
                }
              }

              if (swapIndex !== -1) {
                [this.cards[this.index], this.cards[swapIndex]] = [
                  this.cards[swapIndex],
                  this.cards[this.index],
                ];
                const swappedCard = this.cards[this.index];
                this.index += 1;
                return swappedCard;
              }

              this.cards = shuffleFisherYates(getSource(this.mode));
              this.index = 0;
              this.ensureFirstNot(currentId);
            }

            const fallback = this.cards[this.index] || null;
            this.index += 1;
            return fallback;
          },
        };
      }

      const letterDeck = createDeck((mode) => LETTER_SETS[mode], (card) => card);
      const actionDeck = createDeck(() => ACTION_SET, (card) => card.base);

      // ===== 3) Управление состоянием =====
      const state = {
        mode: "EASY",
        type: "LETTER",
        currentValue: "",
        previousValue: "",
        currentCardId: "",
        previousCardId: "",
        isCurrentVisible: true,
        areControlsVisible: false,
        showControlsHint: true,
      };

      const typedState = {
        LETTER: {
          currentValue: "",
          previousValue: "",
          currentCardId: "",
          previousCardId: "",
        },
        ACTION: {
          currentValue: "",
          previousValue: "",
          currentCardId: "",
          previousCardId: "",
        },
      };

      function saveActiveTypedState() {
        const target = typedState[state.type];
        target.currentValue = state.currentValue;
        target.previousValue = state.previousValue;
        target.currentCardId = state.currentCardId;
        target.previousCardId = state.previousCardId;
      }

      function loadTypedState(type) {
        const source = typedState[type];
        state.currentValue = source.currentValue;
        state.previousValue = source.previousValue;
        state.currentCardId = source.currentCardId;
        state.previousCardId = source.previousCardId;
      }

      function drawLetter() {
        const letter = letterDeck.draw(state.currentCardId);
        if (!letter) return null;
        return { id: letter, value: letter };
      }

      function generateAction() {
        const primary = actionDeck.draw(state.currentCardId);
        if (!primary) return null;

        return { id: primary.base, value: `Нельзя ${primary.base}` };
      }

      function drawAction() {
        return generateAction();
      }

      function nextValue() {
        const drawn = state.type === "LETTER" ? drawLetter() : drawAction();
        if (!drawn) return;

        state.previousValue = state.currentValue;
        state.previousCardId = state.currentCardId;
        state.currentValue = drawn.value;
        state.currentCardId = drawn.id;
        state.isCurrentVisible = true;

        saveActiveTypedState();
        render();
      }

      function setMode(mode) {
        if (!LETTER_SETS[mode]) return;
        state.mode = mode;

        letterDeck.reset(mode, typedState.LETTER.currentCardId);
        if (state.type === "LETTER") {
          nextValue();
          return;
        }

        render();
      }

      function setType(type) {
        if (!typedState[type]) return;
        if (state.type === type) return;

        saveActiveTypedState();
        state.type = type;
        loadTypedState(type);
        state.isCurrentVisible = true;

        if (!state.currentValue) {
          nextValue();
          return;
        }

        render();
      }

      function toggleCurrentVisibility() {
        state.isCurrentVisible = !state.isCurrentVisible;
        render();
      }

      function backToPreviousValue() {
        if (!state.previousValue) return;
        const currentValue = state.currentValue;
        const currentId = state.currentCardId;

        state.currentValue = state.previousValue;
        state.currentCardId = state.previousCardId;
        state.previousValue = currentValue;
        state.previousCardId = currentId;
        state.isCurrentVisible = true;

        saveActiveTypedState();
        render();
      }

      function toggleControls(forceValue) {
        if (typeof forceValue === "boolean") {
          state.areControlsVisible = forceValue;
        } else {
          state.areControlsVisible = !state.areControlsVisible;
        }
        state.showControlsHint = false;
        render();
      }

      // ===== 4) UI =====
      const ui = {
        currentLetter: document.getElementById("currentLetter"),
        prevLetter: document.getElementById("prevLetter"),
        modeBadge: document.getElementById("modeBadge"),
        modeSwitch: document.getElementById("modeSwitch"),
        controls: document.getElementById("controls"),
        controlsHandle: document.getElementById("controlsHandle"),
        controlsHint: document.getElementById("controlsHint"),
        nextBtn: document.getElementById("nextBtn"),
        toggleBtn: document.getElementById("toggleBtn"),
        modeButtons: Array.from(document.querySelectorAll(".mode-btn")),
        typeButtons: Array.from(document.querySelectorAll(".type-btn")),
      };

      function render() {
        ui.currentLetter.textContent = state.currentValue;
        ui.prevLetter.textContent = state.previousValue;
        ui.modeBadge.textContent =
          state.type === "LETTER" ? `${state.type} | ${state.mode}` : state.type;
        ui.toggleBtn.textContent = state.isCurrentVisible ? "Скрыть" : "Показать";
        ui.nextBtn.textContent =
          state.type === "LETTER" ? "Следующая буква" : "Следующее действие";

        const isAction = state.type === "ACTION";
        ui.modeSwitch.style.display = isAction ? "none" : "flex";
        ui.currentLetter.classList.toggle("is-hidden", !state.isCurrentVisible);
        ui.currentLetter.classList.toggle("is-action", isAction);
        ui.prevLetter.classList.toggle("is-action", isAction);
        ui.controls.classList.toggle("is-hidden", !state.areControlsVisible);
        ui.controlsHandle.classList.toggle("is-hidden", state.areControlsVisible);
        ui.controlsHint.classList.toggle("is-hidden", !state.showControlsHint);

        ui.modeButtons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === state.mode);
        });

        ui.typeButtons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.type === state.type);
        });
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } else if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }

      ui.nextBtn.addEventListener("click", nextValue);
      ui.toggleBtn.addEventListener("click", toggleCurrentVisibility);
      ui.modeButtons.forEach((btn) => {
        btn.addEventListener("click", () => setMode(btn.dataset.mode));
      });
      ui.typeButtons.forEach((btn) => {
        btn.addEventListener("click", () => setType(btn.dataset.type));
      });
      ui.controlsHandle.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleControls();
      });
      ui.currentLetter.addEventListener("click", (event) => {
        event.stopPropagation();
        nextValue();
      });
      ui.prevLetter.addEventListener("click", (event) => {
        event.stopPropagation();
        backToPreviousValue();
      });

      document.addEventListener("keydown", (event) => {
        const key = event.key;
        const lower = key.toLowerCase();

        if (key === " " || key === "Spacebar") {
          event.preventDefault();
          nextValue();
          return;
        }

        if (lower === "h") {
          toggleCurrentVisibility();
          return;
        }

        if (lower === "f") {
          toggleFullscreen();
          return;
        }

        if (lower === "l") {
          setType("LETTER");
          return;
        }

        if (lower === "a") {
          setType("ACTION");
          return;
        }

        if (state.type !== "ACTION") {
          if (key === "1") setMode("EASY");
          if (key === "2") setMode("MEDIUM");
          if (key === "3") setMode("CHAOS");
        }
      });

      // Двойной тап/клик для показа или скрытия панели управления.
      let lastTouchTime = 0;
      document.addEventListener(
        "touchend",
        (event) => {
          if (
            event.target.closest(
              ".controls, .controls-handle, .current-letter, .previous-letter"
            )
          ) {
            return;
          }
          const now = Date.now();
          if (now - lastTouchTime < 320) {
            toggleControls();
            event.preventDefault();
          }
          lastTouchTime = now;
        },
        { passive: false }
      );

      document.addEventListener("dblclick", (event) => {
        if (
          event.target.closest(".controls, .controls-handle, .current-letter, .previous-letter")
        ) {
          return;
        }
        toggleControls();
      });

      // UX-ограничения: без скролла, выделения и контекстного меню.
      document.addEventListener("contextmenu", (event) => event.preventDefault());
      document.addEventListener("selectstart", (event) => event.preventDefault());
      window.addEventListener(
        "wheel",
        (event) => event.preventDefault(),
        { passive: false }
      );
      window.addEventListener(
        "touchmove",
        (event) => event.preventDefault(),
        { passive: false }
      );

      // Инициализация.
      letterDeck.reset(state.mode);
      actionDeck.reset("EASY");
      nextValue();
      setTimeout(() => {
        state.showControlsHint = false;
        render();
      }, 6000);
    </script>
  </body>
</html>
